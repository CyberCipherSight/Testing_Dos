<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Plain DOS Prompt</title>

	<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
	<script src="https://v8.js-dos.com/latest/js-dos.js"></script>

	<style>
		html,
		body {
			margin: 0;
			height: 100%;
		}

		#dos {
			width: 100%;
			height: 100%;
		}
	</style>
</head>

<body>
	<div id="dos"></div>
	<script>
		Dos(document.getElementById("dos"), {
			autoplay: true,     // start immediately
			autostart: true,
			kiosk: true,
			//			wasm: "https://v8.js-dos.com/latest/js-dos.wasm",
			cfg: "plain_dos.zip" // THIS removes the Play button
		});
	</script>
</body>

</html>
